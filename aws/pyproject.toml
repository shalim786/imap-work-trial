[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmail-imap"
version = "0.1.0"
description = "AWS asynchronous IMAP reading bridge for AgentMail"
requires-python = ">=3.12"
dependencies = ["agentmail==2.0.6", "httpx==0.28.1", "psycopg[binary,pool]==3.2.10"]

[tool.setuptools.packages.find]
include = ["agentmail_imap*"]
